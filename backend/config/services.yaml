parameters:
    env(UPDATE_REPOSITORY): 'fayouz/rocket-stock'
    env(ROCKET_PLACE_URL): ''
    env(ROCKET_MAILER_URL): ''
    env(ROCKET_MAILER_MAILBOX): ''
    env(ROCKET_MAILER_SENDER): ''
    env(STOCK_ALERT_EMAILS): ''
    env(AMAZON_ASSOCIATE_TAG): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $placeUrl: '%env(ROCKET_PLACE_URL)%'
            $mailerUrl: '%env(ROCKET_MAILER_URL)%'
            $mailerMailbox: '%env(ROCKET_MAILER_MAILBOX)%'
            $demoMailerPath: '%kernel.project_dir%/var/demo-mailer-%kernel.environment%.json'
            $alertEmails: '%env(STOCK_ALERT_EMAILS)%'
            $amazonAssociateTag: '%env(AMAZON_ASSOCIATE_TAG)%'

    App\:
        resource: '../src/'

when@test:
    services:
        App\Tests\Support\HttpMock: ~
